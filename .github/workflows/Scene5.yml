name: Android CI(Scene5)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        ref: scene5

    - uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r23b
        add-to-path: false

    - name: set up JDK 11
      uses: actions/setup-java@v5
      with:
        java-version: '11'
        distribution: 'temurin'   # adopt 已弃用，建议改 temurin
        cache: gradle

    - name: Decode keystore
      if: ${{ secrets.SIGNING_KEY != '' }}
      run: |
        echo "${{ secrets.SIGNING_KEY }}" | base64 -d > ${{ github.workspace }}/app/omoarea.jks
        echo "SIGNING_KEY_PATH=${{ github.workspace }}/app/omoarea.jks" >> $GITHUB_ENV

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleRelease
      env:
        KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        ALIAS: ${{ secrets.ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: scene-dev
        path: ${{ github.workspace }}/app/build/outputs/apk/release/app-release.apk
